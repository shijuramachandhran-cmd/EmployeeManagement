<div class="card shadow-sm">
    <form [formGroup]="departmentForm">
	<div class="card-header">
		<h5 class="mb-0">Add Department</h5>
	</div>

	<div class="card-body">
		<div class="mb-3">
			<label for="departmentName" class="form-label">Department Name</label>
			<input id="departmentName" type="text" class="form-control" formControlName="Name" placeholder="Enter department name">
		</div>

		<button type="button" class="btn btn-primary" (click)="SaveDepartment()">
			<i class="fa-solid fa-floppy-disk me-1" aria-hidden="true"></i>
			Save
		</button>
        <button type="button" class="btn btn-primary" (click)="Cancel()">
			<i class="fa-solid fa-times me-1" aria-hidden="true"></i>
			Cancel
		</button>
	</div>
    </form>
</div>
